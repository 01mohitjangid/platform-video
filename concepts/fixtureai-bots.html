<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FixtureAI bot concepts</title>
<style>
  :root { --bg: #0a0a0a; --card: #141414; --line: rgba(255,255,255,0.08); --ink: #fafafa; --muted: #a1a1a1; --teal: #14b8a6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Plus Jakarta Sans", "Helvetica Neue", sans-serif; }
  header { padding: 28px 32px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 18px; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .controls { padding: 8px 32px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls span { color: var(--muted); font-size: 13px; margin-right: 6px; }
  button { background: #1f1f1f; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button.on { background: var(--teal); color: #042b27; border-color: transparent; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 0 32px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .card canvas { display: block; width: 100%; aspect-ratio: 1 / 1; background: radial-gradient(70% 60% at 50% 60%, #10201d, #0a0a0a 75%); }
  .meta { padding: 14px 18px 18px; }
  .meta b { display: block; font-size: 16px; }
  .meta b small { color: var(--teal); font-weight: 700; margin-right: 8px; }
  .meta p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
</style>
</head>
<body>
<header>
  <h1>FixtureAI bot concepts</h1>
  <p>Eight white-and-teal characters, same lights as the video. Pick a number.</p>
</header>
<div class="controls">
  <span>Mood</span>
  <button data-mood="neutral" class="on">Neutral</button>
  <button data-mood="happy">Happy</button>
  <button data-mood="talking">Talking</button>
  <span style="margin-left:14px">Turn</span>
  <button data-spin="idle" class="on">Idle</button>
  <button data-spin="turn">Full turn</button>
</div>
<div class="grid" id="grid"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.180.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const WHITE_TOP = new THREE.Color("#ffffff"), WHITE_BOTTOM = new THREE.Color("#e2e5e8");
const TEAL = "#14b8a6", TEAL_GLOW = "#7ff5e6", INK = "#15181a";
const DEG = Math.PI / 180;
let mood = "neutral", spin = "idle";

/** White body material with a vertical gradient baked into vertex colours. */
function whiteGeometry(g) {
  g.computeBoundingBox();
  const { min, max } = g.boundingBox;
  const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) - min.y) / Math.max(1e-6, max.y - min.y);
    c.copy(WHITE_BOTTOM).lerp(WHITE_TOP, t);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}
const bodyMat = () => new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.6, metalness: 0.02, emissive: "#ffffff", emissiveIntensity: 0.2 });
const tealMat = () => new THREE.MeshStandardMaterial({ color: TEAL, emissive: TEAL_GLOW, emissiveIntensity: 0.25, roughness: 0.5 });
const inkMat = () => new THREE.MeshStandardMaterial({ color: INK, roughness: 0.9 });

function roundedRect(w, h, r, depth) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x, y + r); s.lineTo(x, y + h - r); s.quadraticCurveTo(x, y + h, x + r, y + h); s.lineTo(x + w - r, y + h);
  s.quadraticCurveTo(x + w, y + h, x + w, y + h - r); s.lineTo(x + w, y + r); s.quadraticCurveTo(x + w, y, x + w - r, y); s.lineTo(x + r, y); s.quadraticCurveTo(x, y, x, y + r);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 4 });
  g.translate(0, 0, -depth / 2);
  return g;
}
const hexPts = (r, rot = 0) => Array.from({ length: 6 }, (_, i) => [r * Math.cos(i * 60 * DEG + rot), r * Math.sin(i * 60 * DEG + rot)]);
function hexShape(r, rot = 0) {
  const s = new THREE.Shape();
  hexPts(r, rot).forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y)));
  s.closePath();
  return s;
}
/** A closed polyline as a thin tube, in the plane z. */
function trace(points, z, radius = 0.0022) {
  const path = new THREE.CurvePath();
  const v = points.map(([x, y]) => new THREE.Vector3(x, y, z));
  for (let i = 0; i < v.length; i++) path.add(new THREE.LineCurve3(v[i], v[(i + 1) % v.length]));
  return new THREE.Mesh(new THREE.TubeGeometry(path, 12 * v.length, radius, 5, true), tealMat());
}

/** Eyes + mouth facing -Z at depth z. Returns the parts the animator needs. */
function face(group, z, { eyeDx = 0.023, eyeY = 0.009, mouthY = -0.024, scale = 1 } = {}) {
  const eye = roundedRect(0.017 * scale, 0.028 * scale, 0.006 * scale, 0.005);
  const happy = new THREE.TorusGeometry(0.0095 * scale, 0.0024 * scale, 6, 12, Math.PI * 0.8);
  const eyes = [], happies = [];
  for (const sx of [1, -1]) {
    const e = new THREE.Mesh(eye, inkMat()); e.position.set(sx * eyeDx, eyeY, z); group.add(e); eyes.push(e);
    const h = new THREE.Mesh(happy, inkMat()); h.position.set(sx * eyeDx, eyeY + 0.004, z); h.visible = false; group.add(h); happies.push(h);
  }
  const mouth = new THREE.Mesh(roundedRect(0.016 * scale, 0.0045 * scale, 0.002, 0.004), inkMat()); mouth.position.set(0, mouthY, z); group.add(mouth);
  const open = new THREE.Mesh(roundedRect(0.016 * scale, 0.012 * scale, 0.004, 0.005), inkMat()); open.position.set(0, mouthY, z); open.visible = false; group.add(open);
  return { eyes, happies, mouth, open };
}

const R = 0.088, D = 0.05, B = 0.011, FRONT = -(D / 2 + B);

const CONCEPTS = [
  {
    n: 1, name: "Hex nut", note: "The current one. Flat hex, teal trace on the face.",
    build(g) {
      const geo = new THREE.ExtrudeGeometry(hexShape(R), { depth: D, bevelEnabled: true, bevelThickness: B, bevelSize: B * 0.9, bevelSegments: 1, curveSegments: 1 });
      geo.translate(0, 0, -D / 2);
      g.add(new THREE.Mesh(whiteGeometry(geo), bodyMat()));
      g.add(trace(hexPts(R * 0.74), FRONT - 0.001));
      return face(g, FRONT - 0.0025);
    },
  },
  {
    n: 2, name: "Soft hex", note: "Same nut, rounded edges. Friendlier, less machine.",
    build(g) {
      const geo = new THREE.ExtrudeGeometry(hexShape(R * 0.9), { depth: 0.05, bevelEnabled: true, bevelThickness: 0.026, bevelSize: 0.024, bevelSegments: 3, curveSegments: 1 });
      geo.translate(0, 0, -0.025);
      g.add(new THREE.Mesh(whiteGeometry(geo), bodyMat()));
      g.add(trace(hexPts(R * 0.62), -0.0515, 0.0018));
      return face(g, -0.053, { eyeDx: 0.021 });
    },
  },
  {
    n: 3, name: "Cap nut", note: "Hex base with a domed top and a teal washer. Reads as a lug nut.",
    build(g) {
      const base = new THREE.ExtrudeGeometry(hexShape(0.08), { depth: 0.075, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 1, curveSegments: 1 });
      base.rotateX(-Math.PI / 2); base.translate(0, -0.055, 0);
      g.add(new THREE.Mesh(whiteGeometry(base), bodyMat()));
      const dome = new THREE.SphereGeometry(0.066, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2); dome.translate(0, 0.02, 0);
      g.add(new THREE.Mesh(whiteGeometry(dome), bodyMat()));
      const washer = new THREE.Mesh(new THREE.CylinderGeometry(0.098, 0.098, 0.012, 24), tealMat()); washer.position.y = -0.062; g.add(washer);
      return face(g, -0.078, { eyeY: -0.012, mouthY: -0.04, eyeDx: 0.021 });
    },
  },
  {
    n: 4, name: "Puck", note: "Round bolt head, chamfered. Teal hex socket drawn inside.",
    build(g) {
      const geo = new THREE.CylinderGeometry(0.086, 0.094, 0.05, 14, 1); geo.rotateX(Math.PI / 2);
      g.add(new THREE.Mesh(whiteGeometry(geo), bodyMat()));
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.086, 0.004, 6, 28), tealMat()); rim.position.z = -0.025; g.add(rim);
      g.add(trace(hexPts(0.055, 30 * DEG), -0.0265, 0.0018));
      return face(g, -0.0285, { eyeDx: 0.02, eyeY: 0.008, mouthY: -0.02, scale: 0.9 });
    },
  },
  {
    n: 5, name: "Gear", note: "Eight teeth, teal hub ring. Most 'engineering', busiest shape.",
    build(g) {
      const s = new THREE.Shape(); const teeth = 8, r1 = 0.07, r2 = 0.09;
      for (let i = 0; i < teeth; i++) {
        const a = (i / teeth) * Math.PI * 2, w = Math.PI / teeth;
        const pts = [[r1, a - w * 0.5], [r2, a - w * 0.28], [r2, a + w * 0.28], [r1, a + w * 0.5]];
        pts.forEach(([r, t], k) => { const x = r * Math.cos(t), y = r * Math.sin(t); (i === 0 && k === 0) ? s.moveTo(x, y) : s.lineTo(x, y); });
      }
      s.closePath();
      const geo = new THREE.ExtrudeGeometry(s, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.005, bevelSegments: 1, curveSegments: 1 });
      geo.translate(0, 0, -0.02);
      g.add(new THREE.Mesh(whiteGeometry(geo), bodyMat()));
      const hub = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.0035, 6, 32), tealMat()); hub.position.z = -0.027; g.add(hub);
      return face(g, -0.029, { eyeDx: 0.019, eyeY: 0.008, mouthY: -0.019, scale: 0.85 });
    },
  },
  {
    n: 6, name: "Capsule", note: "Upright pill with a teal headband. Soft, mascot-like.",
    build(g) {
      const geo = new THREE.CapsuleGeometry(0.062, 0.07, 3, 10);
      g.add(new THREE.Mesh(whiteGeometry(geo), bodyMat()));
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.0625, 0.005, 6, 28), tealMat()); band.rotation.x = Math.PI / 2; band.position.y = 0.045; g.add(band);
      return face(g, -0.061, { eyeDx: 0.021, eyeY: 0.0, mouthY: -0.032 });
    },
  },
  {
    n: 7, name: "Bolt", note: "Hex head on a short threaded shank. The whole fastener.",
    build(g) {
      const head = new THREE.ExtrudeGeometry(hexShape(0.08), { depth: 0.07, bevelEnabled: true, bevelThickness: 0.007, bevelSize: 0.007, bevelSegments: 1, curveSegments: 1 });
      head.rotateX(-Math.PI / 2); head.translate(0, -0.02, 0);
      g.add(new THREE.Mesh(whiteGeometry(head), bodyMat()));
      const shank = new THREE.CylinderGeometry(0.036, 0.036, 0.07, 12); shank.translate(0, -0.06, 0);
      g.add(new THREE.Mesh(whiteGeometry(shank), bodyMat()));
      for (let i = 0; i < 3; i++) { const t = new THREE.Mesh(new THREE.TorusGeometry(0.037, 0.003, 5, 18), tealMat()); t.rotation.x = Math.PI / 2; t.position.y = -0.05 - i * 0.018; g.add(t); }
      return face(g, -0.078, { eyeY: 0.022, mouthY: -0.004, eyeDx: 0.021 });
    },
  },
  {
    n: 8, name: "Hex with ears", note: "The hex nut plus two teal side bolts. A little robot.",
    build(g) {
      const geo = new THREE.ExtrudeGeometry(hexShape(R * 0.92, 30 * DEG), { depth: D, bevelEnabled: true, bevelThickness: B, bevelSize: B * 0.9, bevelSegments: 1, curveSegments: 1 });
      geo.translate(0, 0, -D / 2);
      g.add(new THREE.Mesh(whiteGeometry(geo), bodyMat()));
      for (const sx of [1, -1]) {
        const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.03, 10), tealMat()); ear.rotation.z = Math.PI / 2; ear.position.set(sx * 0.082, 0.012, 0); g.add(ear);
        const cap = new THREE.Mesh(new RoundedBoxGeometry(0.014, 0.026, 0.026, 2, 0.004), bodyMat()); cap.position.set(sx * 0.1, 0.012, 0); g.add(cap);
      }
      return face(g, FRONT - 0.0025);
    },
  },
];

const grid = document.getElementById("grid");
const cards = CONCEPTS.map((c) => {
  const card = document.createElement("div"); card.className = "card";
  const canvas = document.createElement("canvas"); card.appendChild(canvas);
  const meta = document.createElement("div"); meta.className = "meta";
  meta.innerHTML = `<b><small>${c.n}</small>${c.name}</b><p>${c.note}</p>`; card.appendChild(meta); grid.appendChild(card);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
  renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 10); camera.position.set(0.0, 0.02, -0.5); camera.lookAt(0, 0, 0);
  scene.add(new THREE.HemisphereLight("#2b2f7a", "#120a08", 0.6));
  const fill = new THREE.DirectionalLight("#3f4ad8", 0.8); fill.position.set(-3, 1.6, -2.5); scene.add(fill);
  const rim = new THREE.DirectionalLight("#ffb270", 3.2); rim.position.set(-1.8, 2.6, 2.8); rim.castShadow = true; scene.add(rim);
  const key = new THREE.PointLight("#ffffff", 0.35, 1.6, 2); key.position.set(-0.2, 0.35, -0.3); scene.add(key);
  const desk = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ color: "#2a1d14", roughness: 1 })); desk.rotation.x = -Math.PI / 2; desk.position.y = -0.125; desk.receiveShadow = true; scene.add(desk);
  const g = new THREE.Group(); scene.add(g);
  const parts = c.build(g);
  g.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  return { canvas, renderer, scene, camera, g, parts, seed: c.n * 1.7 };
});

function noise(t, s) { return Math.sin(t * 0.7 + s) * 0.5 + Math.sin(t * 1.9 + s * 2.1) * 0.3 + Math.sin(t * 0.23 + s * 0.7) * 0.2; }
function blink(t, s) { const period = 3.4 + (s % 1.3), k = ((t + s) % period); return k < 0.1 ? k / 0.1 : k < 0.25 ? 1 - (k - 0.1) / 0.15 : 0; }

function frame(now) {
  const t = now / 1000;
  for (const c of cards) {
    const w = c.canvas.clientWidth, h = c.canvas.clientHeight;
    if (c.canvas.width !== w * c.renderer.getPixelRatio()) { c.renderer.setSize(w, h, false); c.camera.aspect = w / h; c.camera.updateProjectionMatrix(); }
    const closure = blink(t, c.seed);
    const talking = mood === "talking";
    const open = talking && (Math.sin(t * 11 + c.seed) > 0.1);
    const happy = mood === "happy";
    c.parts.eyes.forEach((e) => { e.visible = !happy; e.scale.y = 1 - 0.92 * closure; });
    c.parts.happies.forEach((e) => { e.visible = happy; e.scale.y = 1 - 0.9 * closure; });
    c.parts.mouth.visible = !open; c.parts.open.visible = open;
    c.g.rotation.set(1.5 * DEG * noise(t, c.seed), spin === "turn" ? t * 0.9 : -8 * DEG + 6 * DEG * noise(t * 0.6, c.seed + 3), 1.5 * DEG * noise(t, c.seed + 5));
    c.g.position.y = 0.004 * Math.sin(t * 1.2 + c.seed) + (open ? 0.002 : 0);
    const s = 1 + (open ? 0.02 : 0); c.g.scale.set(s, s, s);
    c.renderer.render(c.scene, c.camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.querySelectorAll("[data-mood]").forEach((b) => b.addEventListener("click", () => { mood = b.dataset.mood; document.querySelectorAll("[data-mood]").forEach((x) => x.classList.toggle("on", x === b)); }));
document.querySelectorAll("[data-spin]").forEach((b) => b.addEventListener("click", () => { spin = b.dataset.spin; document.querySelectorAll("[data-spin]").forEach((x) => x.classList.toggle("on", x === b)); }));
</script>
</body>
</html>
